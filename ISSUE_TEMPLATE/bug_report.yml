name: Bug report
description: Something in the terminal isn't working right
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If this involves a potential security issue (key handling, signing, anything that could expose funds), please do **not** open a public issue — see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (Help > About), or commit hash if built from source
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - Web (v2)
    validations:
      required: true
  - type: dropdown
    id: exchange
    attributes:
      label: Exchange / venue
      options:
        - Hyperliquid
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Paste any relevant logs. Redact API keys, wallet addresses, or account identifiers first.
      render: shell
