name: Feature request
description: Suggest something the terminal should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the terminal doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd imagine this working, if you have something in mind
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Order entry / hotkeys
        - Charting
        - Positions / PnL
        - Exchange support (new venue)
        - Desktop app / packaging
        - Web (v2)
        - Other
    validations:
      required: true
